name: CI - Alfa Construtora Analytics

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Faz cache do pip para acelerar o build

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar testes automatizados (Pytest)
      run: |
        python -m pytest -v

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Testar Build do Docker (Garante que vai rodar na nuvem)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: alfa-dashboard:latest